<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaxa. Há tempo e espaço.</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #fdf6eb;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    .profile-photo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 30px;
      border: 2px solid #ccc;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4em;
      margin-bottom: 1em;
      line-height: 1.3;
      color: #2b2b2b;
    }

    p {
      font-size: 1.1em;
      margin: 1em 0;
      line-height: 1.6;
    }

    .buttons {
      margin: 30px 0;
    }

    .button {
      display: inline-block;
      margin: 10px 10px 10px 0;
      padding: 14px 32px;
      background-color: #6aa84f;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-family: 'Roboto', sans-serif;
      transition: background 0.3s;
    }

    .button:hover {
      background-color: #558b2f;
    }

    .sessions, .disclaimer, .contact {
      text-align: left;
      margin-top: 40px;
      padding: 0 10px;
    }

    .sessions p, .disclaimer p {
      margin: 8px 0;
    }

    .contact p {
      margin: 6px 0;
    }

    .footer {
      margin-top: 50px;
      font-style: italic;
      color: #555;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 2em;
      }
      .profile-photo {
        width: 100px;
        height: 100px;
      }
      .button {
        width: 100%;
        margin: 10px 0;
      }
    }
  </style>
</head>
<body>

    <!-- Foto -->
    <img src="foto.jpg" alt="Foto do terapeuta" class="profile-photo">
